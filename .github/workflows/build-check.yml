name: Build Check

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  js-test:
    runs-on: ubuntu-latest
    name: Jest unit tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run Jest tests
        run: npm test

  kotlin-compile:
    runs-on: ubuntu-latest
    name: Verify Kotlin compilation
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create minimal Expo host app
        run: |
          cd /tmp
          npx --yes create-expo-app@latest host-app --template blank --no-install
          cd host-app
          npm install
          # Copy the module into node_modules manually to avoid prepare script
          MODULE_DIR=node_modules/expo-tiddlywiki-filesystem-android-external-storage
          mkdir -p "$MODULE_DIR"
          cp -r $GITHUB_WORKSPACE/android "$MODULE_DIR/"
          cp $GITHUB_WORKSPACE/expo-module.config.json "$MODULE_DIR/"
          cp $GITHUB_WORKSPACE/package.json "$MODULE_DIR/"
          # Create minimal JS entry so node can resolve the module
          mkdir -p "$MODULE_DIR/build"
          echo "module.exports = {};" > "$MODULE_DIR/build/index.js"

      - name: Prebuild Android project
        working-directory: /tmp/host-app
        run: npx expo prebuild --platform android --no-install

      - name: Compile Kotlin (debug)
        working-directory: /tmp/host-app/android
        run: |
          # Find the exact Gradle module name for our library
          MODULE=$(grep -r 'expo-tiddlywiki' settings.gradle* | head -1 | sed "s/.*'\\(.*\\)'.*/\\1/" || echo "")
          echo "Detected module: $MODULE"
          if [ -n "$MODULE" ]; then
            ./gradlew ":${MODULE}:compileDebugKotlin" --no-daemon
          else
            echo "Module not found in settings, trying full compile..."
            ./gradlew compileDebugKotlin --no-daemon 2>&1 | tail -200
          fi
